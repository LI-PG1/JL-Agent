name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # 固定微版本：与本地验证一致（PyInstaller bootloader 与 CPython 微版本强绑定，
          # setup-python 3.12 默认装最新微版本会导致 EXE 构建失败）
          python-version: '3.12.10'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller==6.21.0"

      - name: Build standalone EXE
        continue-on-error: true
        run: |
          python --version
          pip show pyinstaller | Select-String Version
          python portable/build_exe.py 2>&1 | Tee-Object -FilePath build_exe.log
          if (-not (Test-Path dist/JL-Agent.exe)) { Write-Error "EXE 未生成" ; exit 1 }

      - name: Upload build log (diagnostics)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            build_exe.log
            dist/JL-Agent.exe
          if-no-files-found: ignore

      - name: Build portable ZIP
        run: python portable/build_portable.py

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/JL-Agent.exe
            dist/JL-Agent-portable.zip
          generate_release_notes: true
          overwrite: true
