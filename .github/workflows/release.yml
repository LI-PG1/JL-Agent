name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          # 固定微版本：与本地验证一致（PyInstaller bootloader 与 CPython 微版本强绑定，
          # setup-python 3.12 默认装最新微版本会导致 EXE 构建失败）
          python-version: '3.12.10'

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller==6.21.0"

      # 顺序：先 portable（会 rmtree 重建 dist/），后 EXE（追加写入 dist/JL-Agent.exe），
      # 避免 portable 重建时误删 EXE 导致 Release 上传缺失
      - name: Build portable ZIP
        run: python portable/build_portable.py

      - name: Build standalone EXE
        run: python portable/build_exe.py

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/JL-Agent.exe
            dist/JL-Agent-portable.zip
          generate_release_notes: true
          overwrite: true
