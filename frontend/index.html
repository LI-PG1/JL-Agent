<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JL-Agent 简历生成器</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <h1>JL-Agent</h1>
    <span class="sub">简历生成工作台</span>
  </header>
  <main class="layout">
    <section class="card">
      <h2>服务状态</h2>
      <p id="health-status">检测中…</p>
    </section>
    <section class="card">
      <h2>表单模块（P2 起逐步接入）</h2>
      <p class="placeholder">基础信息 / 教育经历 / 附加信息（实习·项目·技能·荣誉）/ 岗位 JD</p>
    </section>
    <section class="card">
      <h2>生成与导出（P4 起逐步接入）</h2>
      <p class="placeholder">一键生成 · 进度条 · 预览编辑 · 动态适配 · 水印/确认清单 · HTML/PDF 导出</p>
    </section>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
